<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><meta name="robots" content="noindex">
  <title>Private access · Human Gate</title>
  <link rel="stylesheet" href="/_gate/style.css">
  <script type="module" src="/_gate/client.js"></script>
</head>
<body class="gate">
  <main class="stage">
    <div class="site"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg><span>Private website</span></div>
    <section class="panel" data-tone="accent" aria-labelledby="access-heading">
      <div class="mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4.5"/><path d="M11.3 11.7 20 3"/><path d="M16.5 6.5l3 3"/><path d="M14 9l2 2"/></svg></div>
      <h1 id="access-heading">Welcome back</h1>
      <p class="lede">This website limits automated access. Continue with your approved passkey: your device’s fingerprint, face recognition, PIN or security key.</p>
      <button id="login" type="button">Continue with a passkey</button>
      <div class="divider"></div>
      <details><summary>Have an invitation?</summary>
        <form id="enroll"><label for="invite">One-time invitation code</label><input id="invite" name="invite" type="password" autocomplete="off" maxlength="43" required spellcheck="false"><button type="submit" class="secondary">Register this device</button></form>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
      <noscript><p>JavaScript is required for passkey verification. Contact the website operator if you need assistance.</p></noscript>
    </section>
    <footer class="meta"><span>Need access? Contact this website’s operator.</span><span>Protected by Human Gate</span></footer>
  </main>
</body>
</html>
