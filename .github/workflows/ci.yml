name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - run: npm run browser:install -- --with-deps
      - run: npm run benchmark:browser
      - run: npm run showcase
      - run: node scripts/check-showcase.mjs
      - run: npm audit --omit=dev --audit-level=high
